plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'java-library'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"command-keybind" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version_26_1}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version_26_1}"

	implementation project(':common')

	// ModMenu (optional dependency, used to add a config screen entry)
	def modmenuJar = file("${rootProject.projectDir}/libs/modmenu-18.0.0.jar")
	if (modmenuJar.exists()) {
		compileOnly files(modmenuJar)
	} else {
		compileOnly files("D:/Downloads/modmenu-${project.modmenu_version}.jar")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	archiveFileName = "command-keybind-${project.version}-mc${project.minecraft_version_26_1}.jar"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}
