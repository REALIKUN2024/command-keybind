plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'java-library'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"command-keybind" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version_26_1}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version_26_1}"

	implementation project(':common')

	// ModMenu (optional compileOnly, auto-downloaded by root :downloadModMenu)
	compileOnly files(rootProject.modmenuJarFor(project.minecraft_version_26_1))

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from project(':common').sourceSets.main.output
	archiveFileName = "command-keybind-${project.version}-mc${project.minecraft_version_26_1}.jar"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}
