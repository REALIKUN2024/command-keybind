plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'java-library'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

loom {
	mods {
		"command-keybind" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version_1_21_8}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version_1_21_8}"

	implementation project(':common')

	// ModMenu (optional; modCompileOnly 以便 loom 重映射到本模块命名空间，auto-downloaded by root :downloadModMenu)
	modCompileOnly files(rootProject.modmenuJarFor(project.minecraft_version_1_21_8))

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from project(':common').sourceSets.main.output
}

remapJar {
	archiveFileName = "command-keybind-${project.version}-mc${project.minecraft_version_1_21_8}.jar"
}
