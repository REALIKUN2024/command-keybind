// 根聚合工程：不应用 Loom，仅统一配置各子模块。

allprojects {
	group = project.property('maven_group')
	version = project.property('mod_version')

	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
	}
}

subprojects {
	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
	}
}
