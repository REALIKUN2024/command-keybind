plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'java-library'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

loom {
	mods {
		"command-keybind" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version_1_16}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version_1_16}"

	implementation project(':common')

	// ModMenu (optional; modCompileOnly 以便 loom 重映射到本模块命名空间，auto-downloaded by root :downloadModMenu)
	modCompileOnly files(rootProject.modmenuJarFor(project.minecraft_version_1_16))

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// 1.16 的 fabric-resource-loader 仅读取 mod 根路径 getRootPath()（dev 模式 classpath 第一个路径 = classes，
// 不含资源），导致语言文件等资源在 dev 运行时不加载。将资源复制进 classes 目录以修复。
classes {
	doLast {
		copy {
			from sourceSets.main.resources
			into layout.buildDirectory.dir('classes/java/main')
		}
	}
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from project(':common').sourceSets.main.output
}

remapJar {
	archiveFileName = "command-keybind-${project.version}-mc${project.minecraft_version_1_16}.jar"
}
