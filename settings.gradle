pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// 缺失的 JDK toolchain（8/17/21）由 Gradle 自动下载，CI 与本地一致
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'command-keybind'

include 'common'
include 'mod-1_16'
include 'mod-1_18'
include 'mod-1_19_2'
include 'mod-1_19_4'
include 'mod-1_20_1'
include 'mod-1_20_6'
include 'mod-1_21_8'
include 'mod-1_21_10'
include 'mod-1_21_11'
include 'mod-26_1'
include 'mod-26_2'
