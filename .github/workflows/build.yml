# Build every version module and upload the resulting jars.
# JDK 25 runs Gradle; JDK 8/17/21 toolchains are auto-downloaded via the
# foojay resolver (settings.gradle). ModMenu jars are auto-downloaded by the
# root :downloadModMenu task (wired into compileJava).

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            mod-*/build/libs/command-keybind-*.jar
            common/build/libs/*.jar
