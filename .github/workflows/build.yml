# Build every version module and upload the resulting jars.
# JDK 25 runs Gradle; JDK 8/17/21 toolchains are auto-downloaded via the
# foojay resolver (settings.gradle). ModMenu jars are auto-downloaded by the
# root :downloadModMenu task (wired into compileJava).

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: diag mc download source
        run: |
          time curl -sSL -o /tmp/mc.jar https://piston-data.mojang.com/v1/objects/37fd3c903861eeff3bc24b71eed48f828b5269c8/client.jar
          echo "37fd3c903861eeff3bc24b71eed48f828b5269c8  /tmp/mc.jar" | sha1sum -c - || true
          ls -la /tmp/mc.jar || true
      - name: build
        run: ./gradlew build --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            mod-*/build/libs/command-keybind-*.jar
            common/build/libs/*.jar
